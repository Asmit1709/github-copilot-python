<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Game</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<div class="page-shell">

    <div class="content-layout">

        <!-- LEFT PANEL -->

        <aside class="panel left-panel">

            <h2 class="panel-title">
                Controls
            </h2>

            <div class="control-group">

                <label for="player-name">
                    Player Name
                </label>

                <input
                    id="player-name"
                    type="text"
                    maxlength="40"
                    placeholder="Enter your name">

            </div>

            <div class="control-group">

                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>

            </div>

            <div class="control-group">

                <button id="new-game">
                    New Game
                </button>

            </div>

        </aside>



        <!-- CENTER PANEL -->

        <main class="center-panel">

            <h1>
                Sudoku Game
            </h1>

            <div class="board-container">

                <div id="sudoku-board"></div>

            </div>

            <div class="timer-wrapper">

                <span class="timer-label">
                    Time
                </span>

                <span id="timer">
                    00:00
                </span>

            </div>

            <section id="leaderboard" class="panel leaderboard-panel">
    <h2>Leaderboard</h2>
    <p class="leaderboard-subtitle">Top 10 Fastest Times</p>
    <ol id="leaderboard-list"></ol>
</section>

        </main>



        <!-- RIGHT PANEL -->

        <aside class="panel right-panel">

            <h2 class="panel-title">
                Actions
            </h2>

            <div class="control-group">

                <button id="check-solution">
                    Check Puzzle
                </button>

            </div>

            <div class="control-group">

                <button id="hint">
                    Hint
                </button>

            </div>

            <div class="control-group">

                <button id="theme-toggle">
                    Dark Mode
                </button>

            </div>

            <div
                id="message"
                class="status-message">
            </div>

        </aside>

    </div>

</div>



<!-- WIN MODAL -->

<div
    id="win-modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="win-modal-title">

    <div class="modal-content">

        <h2 id="win-modal-title">
            Congratulations!
        </h2>

        <p id="win-modal-message"></p>

        <div class="modal-actions">

            <button id="save-score">
                Save Score
            </button>

            <button id="close-modal">
                Close
            </button>

        </div>

    </div>

</div>

<script src="/static/main.js"></script>

</body>
</html>
