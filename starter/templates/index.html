<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-shell">
    <h1>Sudoku Game</h1>
    <div class="controls difficulty-controls">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="controls timer-controls">
      <span id="timer">00:00</span>
    </div>
    <div class="content-layout">
      <div class="board-container">
        <div id="sudoku-board"></div>
      </div>
      <div id="leaderboard" class="leaderboard">
        <h2>Leaderboard</h2>
        <ol id="leaderboard-list"></ol>
      </div>
    </div>
    <div class="controls action-controls">
      <button id="new-game">New Game</button>
      <button id="check-solution">Check Solution</button>
      <button id="hint">Hint</button>
      <button id="theme-toggle" type="button">Dark Mode</button>
      <span id="message"></span>
    </div>
  </div>
  <div id="win-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="win-modal-title">
    <div class="modal-content">
      <h2 id="win-modal-title">Congratulations!</h2>
      <p id="win-modal-message"></p>
      <label for="player-name">Your name</label>
      <input id="player-name" type="text" maxlength="40" placeholder="Enter your name">
      <div class="modal-actions">
        <button id="save-score" type="button">Save Score</button>
        <button id="close-modal" type="button">Close</button>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
